<!DOCTYPE html>
<html lang="ru">

<head>
    <title>MineCore — Карта мира</title>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- OpenLayers -->
    <link rel="stylesheet" type="text/css" href="lib/ol.css">
    <script src="lib/ol.js"></script>

    <!-- OpenLayers Context Menu -->
    <link href="lib/ol-contextmenu.css" rel="stylesheet">
    <script src="lib/ol-contextmenu.iife.js"></script>

    <!-- Toastify -->
    <script type="text/javascript" src="lib/toastify-js.js"></script>
    <link rel="stylesheet" type="text/css" href="lib/toastify-js.min.css">

    <!-- Map metadata generated by uNmINeD -->
    <script type="text/javascript" src="unmined.map.properties.js"></script>
    <script type="text/javascript" src="unmined.map.regions.js"></script>
    <script type="text/javascript" src="unmined.map.players.js"></script>

    <!-- Custom markers -->
    <script type="text/javascript" src="custom.markers.js"></script>

    <!-- uNmINeD JS and Base CSS -->
    <script type="text/javascript" src="unmined.js"></script>
    <link rel="stylesheet" type="text/css" href="index.css">

    <!-- App Styles -->
    <link rel="stylesheet" type="text/css" href="app.css">
</head>

<body>

    <!-- ============================================================
         TOP NAVIGATION BAR
         ============================================================ -->
    <header class="app-header">
        <!-- Left: Logo & Brand -->
        <div class="header-left">
            <a href="#" class="brand-link" id="brandLogo" title="Центрировать карту на спавне (0, 0)">
                <img src="favicon.png" alt="MineCore Logo" class="brand-logo-img" />
                <div class="brand-info">
                    <span class="brand-name">MineCore</span>
                    <span class="brand-server-tag">
                        <span class="status-dot"></span>
                        <span>Сервер онлайн</span>
                    </span>
                </div>
            </a>
        </div>

        <!-- Center: Navigation Tabs -->
        <nav class="header-nav">
            <button class="nav-btn" id="toggleSidebarBtn" title="Каталог локаций (Tab)">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                <span>Места</span>
                <span class="nav-badge" id="markersCountBadge">0</span>
            </button>

            <button class="nav-btn nav-btn-primary" id="addMarkerBtn" title="Добавить новую точку на карту (N)">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                <span>Добавить точку</span>
                <kbd class="nav-kbd">N</kbd>
            </button>

            <button class="nav-btn nav-btn-random" id="randomPlaceBtn" title="Переместиться к случайной точке (R)">
                <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" ry="3"/><circle cx="8" cy="8" r="1.5"/><circle cx="16" cy="16" r="1.5"/><circle cx="12" cy="12" r="1.5"/></svg>
                <span>Рандомное место</span>
                <kbd class="nav-kbd">R</kbd>
            </button>
        </nav>

        <!-- Right: Coords & Spawn & Logo -->
        <div class="header-right">
            <!-- Live Coordinates HUD -->
            <div class="header-coords" id="liveCoordsHud" title="Координаты курсора в блоках Minecraft">
                <span class="coord-axis">X</span>
                <span id="hudCoordX">0</span>
                <span class="coord-sep">/</span>
                <span class="coord-axis">Z</span>
                <span id="hudCoordZ">0</span>
            </div>

            <button class="nav-btn nav-btn-spawn" id="spawnBtn" title="Центрировать на спавне (0, 0)">
                <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M22 12h-4M6 12H2M12 6V2M12 22v-4"/></svg>
                <span>Спавн</span>
            </button>

            <!-- Right Logo / Server Icon -->
            <div class="header-server-badge" title="MineCore">
                <img src="favicon.png" alt="MineCore" class="server-badge-img" />
            </div>
        </div>
    </header>

    <!-- ============================================================
         PLACEMENT BANNER (WHEN ADDING MARKER)
         ============================================================ -->
    <div class="placement-banner" id="placementBanner">
        <div class="placement-pulse-dot"></div>
        <span>Кликните в любое место на карте, чтобы поставить точку</span>
        <button class="nav-btn" id="cancelPlacementBtn" style="padding:4px 10px; font-size:11px; margin-left:6px;">
            Отмена <kbd class="nav-kbd">Esc</kbd>
        </button>
    </div>

    <!-- ============================================================
         LEFT SIDEBAR (PLACES CATALOG)
         ============================================================ -->
    <aside class="sidebar-panel" id="sidebarPanel">
        <div class="sidebar-header">
            <div class="sidebar-title">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                <span>Каталог локаций</span>
            </div>
            <button class="nav-btn" id="sidebarCloseBtn" style="padding:4px 8px; font-size:11px;" title="Скрыть панель (Tab)">
                ✕
            </button>
        </div>

        <!-- Search Bar -->
        <div class="search-box">
            <svg class="search-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" class="search-input" id="sidebarSearchInput" placeholder="Поиск по названию, описанию..." />
            <kbd class="search-kbd-hint">/</kbd>
        </div>

        <!-- Category Filter Chips -->
        <div class="category-filter" id="categoryFilterChips">
            <!-- Dynamically populated -->
        </div>

        <!-- Markers List -->
        <div class="markers-list" id="sidebarMarkersList">
            <!-- Dynamically populated cards -->
        </div>

        <!-- Sidebar Footer -->
        <div class="sidebar-footer">
            <button class="nav-btn" id="exportMarkersBtn" style="flex:1;" title="Экспортировать точки в JSON">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                <span>Экспорт</span>
            </button>
            <button class="nav-btn" id="importMarkersBtn" style="flex:1;" title="Импортировать точки из JSON">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                <span>Импорт</span>
            </button>
        </div>
    </aside>

    <!-- ============================================================
         MARKER DETAIL DRAWER (RIGHT PANEL)
         ============================================================ -->
    <div class="detail-drawer" id="markerDetailDrawer">
        <!-- Close button -->
        <div class="drawer-close-btn" id="drawerCloseBtn" title="Закрыть (Esc)">✕</div>

        <!-- Cover photo container -->
        <div class="drawer-cover" id="drawerCoverBox">
            <!-- Photo or empty state inserted via JS -->
        </div>

        <!-- Content details -->
        <div class="drawer-content">
            <div class="drawer-header">
                <div class="drawer-badge-row">
                    <span class="drawer-category-tag" id="drawerCategoryBadge">
                        <span class="drawer-category-dot" id="drawerCategoryDot"></span>
                        <span id="drawerCategoryName">База</span>
                    </span>
                    <span id="drawerDistance" style="font-family:var(--font-mono); font-size:11px; color:var(--text-tertiary);"></span>
                </div>
                <div class="drawer-title" id="drawerTitle">Название точки</div>
            </div>

            <!-- Coordinates & Action Bar -->
            <div class="drawer-coords-box">
                <div>
                    <div class="coords-label">Координаты</div>
                    <div class="coords-text" id="drawerCoords">X: 0 / Z: 0</div>
                </div>
                <div style="display:flex; gap:6px;">
                    <button class="nav-btn" id="copyTpBtn" title="Скопировать команду /tp для чата Minecraft">
                        <svg class="nav-icon" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        <span>/tp</span>
                    </button>
                    <button class="nav-btn" id="centerMarkerBtn" title="Центрировать камеру">
                        <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M22 12h-4M6 12H2M12 6V2M12 22v-4"/></svg>
                    </button>
                    <button class="nav-btn" id="shareMarkerBtn" title="Скопировать ссылку на точку">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                    </button>
                </div>
            </div>

            <!-- Description -->
            <div class="drawer-description" id="drawerDesc">
                Описание точки
            </div>

            <!-- Actions -->
            <div class="drawer-actions">
                <button class="nav-btn nav-btn-primary" id="editMarkerBtn" style="flex:1;">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    <span>Редактировать</span>
                </button>
                <button class="nav-btn" id="deleteMarkerBtn" title="Удалить эту метку" style="color:var(--accent-rose); border-color:rgba(244,63,94,0.3);">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- ============================================================
         ADD / EDIT MARKER MODAL
         ============================================================ -->
    <div class="modal-backdrop" id="markerModal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Новая точка на карте</div>
                <div class="nav-btn" id="modalCloseBtn" style="padding:4px 8px; cursor:pointer;">✕</div>
            </div>

            <div class="modal-body">
                <!-- Title -->
                <div class="form-group">
                    <label class="form-label">Название точки</label>
                    <input type="text" class="form-input" id="markerTitleInput" placeholder="Например: Замок, Портал в Незер, Ферма железа..." />
                </div>

                <!-- Category -->
                <div class="form-group">
                    <label class="form-label">Категория</label>
                    <div class="category-picker-grid" id="categoryPickerGrid">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Coordinates -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Координата X</label>
                        <input type="number" class="form-input" id="markerXInput" placeholder="0" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Координата Z</label>
                        <input type="number" class="form-input" id="markerZInput" placeholder="0" />
                    </div>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <button type="button" class="nav-btn" id="pickCenterCoordsBtn" style="font-size:11px; padding:5px 10px;">
                        🎯 Центр экрана
                    </button>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <label class="form-label" style="margin:0; font-size:11px;">Цвет маркера:</label>
                        <input type="color" id="markerColorInput" value="#38bdf8" style="cursor:pointer; background:none; border:none; width:26px; height:26px; padding:0;" />
                    </div>
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label class="form-label">Описание</label>
                    <textarea class="form-textarea" id="markerDescInput" rows="3" placeholder="Заметки, координаты входов, ресурсы, владельцы..."></textarea>
                </div>

                <!-- Photo Upload Area -->
                <div class="form-group">
                    <label class="form-label">Фотография / Скриншот</label>
                    <input type="file" id="markerImageFileInput" accept="image/*" style="display:none;" />
                    
                    <div class="image-upload-dropzone" id="imageDropzone">
                        <svg class="nav-icon" style="width:24px; height:24px; color:var(--text-tertiary);" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                        <div style="font-weight:600; font-size:13px; color:#fff;">Выберите файл или перетащите сюда</div>
                        <div style="font-size:11px; color:var(--text-tertiary);">Поддерживаются PNG, JPG, WebP. Или нажмите <kbd class="nav-kbd">Ctrl+V</kbd> для вставки скриншота</div>
                    </div>

                    <!-- URL input fallback -->
                    <div style="margin-top:8px;">
                        <input type="text" class="form-input" id="markerImageUrlInput" placeholder="Или прямая ссылка на изображение (https://...)" style="font-size:11px; padding:6px 10px;" />
                    </div>

                    <!-- Staged Image Preview -->
                    <div class="image-preview-box" id="modalImagePreviewBox">
                        <img id="modalImagePreview" src="" alt="Предпросмотр" />
                        <button type="button" class="image-preview-remove-btn" id="removeModalImageBtn">✕ Удалить</button>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="nav-btn" id="cancelModalBtn">Отмена</button>
                <button type="button" class="nav-btn nav-btn-primary" id="saveModalBtn">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
         FULLSCREEN IMAGE LIGHTBOX
         ============================================================ -->
    <div class="lightbox-backdrop" id="lightboxBackdrop" title="Кликните в любое место, чтобы закрыть (Esc)">
        <img class="lightbox-image" id="lightboxImage" src="" alt="Фотография" />
    </div>

    <!-- ============================================================
         MARKER HOVER TOOLTIP
         ============================================================ -->
    <div class="marker-hover-tooltip" id="markerHoverTooltip"></div>

    <!-- ============================================================
         MAP CONTAINER
         ============================================================ -->
    <div id="map"></div>

    <!-- ============================================================
         APP INITIALIZATION SCRIPTS
         ============================================================ -->
    <script type="text/javascript">
        document.title = "MineCore — Карта сервера";

        if (typeof UnminedCustomMarkers !== 'undefined' && UnminedCustomMarkers && UnminedCustomMarkers.isEnabled && UnminedCustomMarkers.markers) {
            UnminedMapProperties.markers = UnminedMapProperties.markers.concat(UnminedCustomMarkers.markers);
        }

        if (typeof UnminedPlayers !== 'undefined' && UnminedPlayers && UnminedPlayers.length > 0) {
            UnminedMapProperties.playerMarkers = Unmined.createPlayerMarkers(UnminedPlayers);
        }

        const mapElement = document.getElementById('map');
        window.unmined = new Unmined(mapElement, UnminedMapProperties, UnminedRegions);
    </script>

    <!-- Markers Database & App Logic -->
    <script type="text/javascript" src="markers-store.js"></script>
    <script type="text/javascript" src="app.js"></script>

</body>

</html>
